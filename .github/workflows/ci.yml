# Runs on every push and pull request. Four jobs run side by side:
#   lint           ruff (format and lint) and mypy (types) over the Python code
#   preprocessing  Layer 1 pipeline unit tests, then a quick Layer 1 tester run
#   server         API, processing and scenario tests
#   app            typecheck, lint and the HealthKit conversion checks (no iPhone needed)
# Python packages come from the lock files, so CI uses exactly the versions developers use.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install (from the lock file)
        working-directory: server
        run: pip install -r requirements-dev.txt
      - name: Formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy

  preprocessing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preprocessing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: preprocessing/requirements.txt
      - name: Install (from the lock file)
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Layer 1 tester (quick run, unit tests and daily replay already covered)
        run: python agent_testing/run_layer1_tests.py --skip-unit --skip-daily
      - name: Keep the tester report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer1-report
          path: preprocessing/agent_testing/reports/
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install (from the lock file)
        run: pip install -r requirements-dev.txt
      - name: Server tests
        run: python -m pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: HealthKit conversion checks
        run: npm test
